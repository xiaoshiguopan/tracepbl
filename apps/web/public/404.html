<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正在返回史证工坊</title>
  </head>
  <body>
    <main>
      <h1>正在返回史证工坊</h1>
      <p>如果页面没有自动恢复，请返回演示首页。</p>
      <a href="/tracepbl/">返回演示首页</a>
    </main>
    <script>
      try {
        if (location.pathname.startsWith("/tracepbl/")) {
          sessionStorage.setItem(
            "tracepbl:spa-path:v1",
            location.pathname + location.search + location.hash,
          );
          location.replace("/tracepbl/");
        }
      } catch {
        // Keep the visible recovery link when storage is unavailable.
      }
    </script>
  </body>
</html>
