name: Publish static Demo (manual)

on:
  workflow_dispatch:
    inputs:
      approved:
        description: Explicit approval to publish this main commit to public GitHub Pages
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.approved
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm
      - name: Require matching successful CI and fixed project path
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const repo=process.env.REPOSITORY;
          assert.equal(repo.split('/')[1], 'tracepbl', 'Pages base is frozen to /tracepbl/');
          const response=await fetch(`https://api.github.com/repos/${repo}/actions/workflows/ci.yml/runs?head_sha=${process.env.COMMIT}&event=push&per_page=100`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
          assert.ok(response.ok, 'Cannot verify CI');
          const runs=(await response.json()).workflow_runs;
          assert.ok(runs.some(run=>run.head_sha===process.env.COMMIT&&run.head_branch==='main'&&run.status==='completed'&&run.conclusion==='success'), 'Same commit must pass CI before publishing');
          JS
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-pages-artifact.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
